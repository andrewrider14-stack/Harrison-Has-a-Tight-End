<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -12%,#182432 0,#070b12 40%,#04080e 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1500px;margin:auto;padding:30px 28px 50px}.top{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap}.kicker{text-transform:uppercase;letter-spacing:.18em;color:#aab7c8;font-size:11px;font-weight:850}.title{font-size:clamp(38px,5vw,66px);line-height:.92;letter-spacing:-.06em;font-weight:950;margin:8px 0}.subtitle{color:var(--muted);font-size:15px}.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}.live{border:1px solid #1b4938;background:#07130f;border-radius:999px;padding:9px 14px;font-size:12px;color:#b7c4d0;display:flex;gap:8px;align-items:center}.pulse{width:8px;height:8px;background:var(--good);border-radius:50%;box-shadow:0 0 12px #52df9288}.updated{font-size:12px;color:#aeb9c7}.preseason{border:1px solid #09573e;background:linear-gradient(180deg,#061712,#04100d);border-radius:14px;padding:12px 18px;text-align:center;margin-bottom:16px}.preseason-title{color:var(--good);font-size:13px;font-weight:900;letter-spacing:.06em}.preseason-copy{font-size:11px;color:#9aabb8;margin-top:4px}.score{display:grid;grid-template-columns:1fr 110px 1fr;gap:12px;align-items:stretch}.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:318px}.card.sea{border-color:#143744}.card.jet{border-color:#3b281c}.photo-area{height:250px;position:relative;overflow:hidden;background:radial-gradient(circle at 25% 70%,#0d2733,#071019 68%)}.jet .photo-area{background:radial-gradient(circle at 75% 70%,#2a1a10,#0d1016 68%)}.photo{position:absolute;bottom:0;left:0;width:52%;height:100%;object-fit:contain;object-position:center bottom;z-index:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.35))}.jet .photo{left:auto;right:0}.team-mark{position:absolute;font-size:72px;line-height:1;font-weight:950;letter-spacing:-.08em;opacity:.14;top:42px;left:22px;color:#7be2ef;z-index:0}.jet .team-mark{left:auto;right:22px;color:#ff9a4f}.player-copy{position:absolute;top:20px;left:49%;z-index:3}.jet .player-copy{left:22%}.team{color:var(--sea);text-transform:uppercase;font-size:10px;letter-spacing:.16em;font-weight:900}.jet .team{color:var(--jet)}.name{font-size:25px;font-weight:950;letter-spacing:-.035em;margin-top:5px;line-height:1.05}.number{font-size:13px;font-weight:900;color:var(--good);margin-top:8px}.jet .number{color:var(--jet)}.points{position:absolute;left:49%;bottom:18px;z-index:3}.jet .points{left:22%}.points-value{font-size:57px;font-weight:950;line-height:.9;letter-spacing:-.07em}.points-label{text-transform:uppercase;letter-spacing:.13em;font-size:9px;color:#9aa8b8;font-weight:850;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:13px 10px 14px;gap:4px;background:#070c13}.stat{text-align:center}.stat b{font-size:18px;display:block}.stat span{font-size:8px;color:#8796a8;text-transform:uppercase;letter-spacing:.07em}.middle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.vs{font-size:10px;color:var(--muted);letter-spacing:.2em;font-weight:900}.leader{font-size:19px;font-weight:950;margin-top:8px}.margin{font-size:10px;color:var(--muted);margin-top:3px}.lower{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.panel{margin-top:16px;background:rgba(8,14,22,.9);border:1px solid var(--line);border-radius:16px;padding:17px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.panel-title{font-weight:900;font-size:16px}.panel-note{font-size:11px;color:var(--muted)}.chart{margin-top:13px}.chart svg{width:100%;height:285px;display:block}.gridline{stroke:#1b2734;stroke-width:1}.axis{fill:#718095;font-size:10px}.line-sea{fill:none;stroke:var(--sea);stroke-width:3}.line-jet{fill:none;stroke:var(--jet);stroke-width:3}.dot-sea{fill:var(--sea)}.dot-jet{fill:var(--jet)}.legend{display:flex;gap:20px;margin-top:4px;font-size:11px;color:#aab6c5}.key{display:flex;gap:7px;align-items:center}.swatch{width:10px;height:10px;border-radius:50%}.sea-dot{background:var(--sea)}.jet-dot{background:var(--jet)}.table-wrap{overflow:auto;margin-top:9px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:right;padding:8px 8px;border-bottom:1px solid #17212d;font-size:11px}.table th{color:#8795a6;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.table th:first-child,.table td:first-child{text-align:left}.table .winner{font-weight:950}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.rule{background:#080e15;border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center}.rule b{display:block;font-size:17px}.rule span{font-size:9px;color:var(--muted)}.footer{color:#687789;font-size:10px;text-align:center;margin-top:18px;line-height:1.5}.error{padding:14px;background:#281518;border:1px solid #5a2b31;border-radius:12px;color:#ffb2b2;font-size:13px}.loading{color:var(--muted);font-size:13px;padding:15px 0}
@media(max-width:850px){main{padding:20px 14px 36px}.top{display:block;margin-bottom:14px}.kicker{font-size:9px}.title{font-size:38px;line-height:.95;margin:6px 0}.subtitle{font-size:13px;line-height:1.35}.top-right{margin-top:14px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px}.live{padding:7px 10px;font-size:10px}.updated{font-size:10px}.preseason{padding:10px 12px;margin-bottom:12px}.preseason-title{font-size:11px}.preseason-copy{font-size:10px}.score{grid-template-columns:1fr;gap:6px}.middle{padding:5px 0 6px}.card{min-height:0}.photo-area{height:210px}.stats{padding:11px 6px 12px}.stat b{font-size:17px}.stat span{font-size:7px}.lower{grid-template-columns:1fr;gap:0}.panel{margin-top:12px;padding:14px;border-radius:14px}.panel-title{font-size:15px}.panel-note{font-size:10px}.chart svg{height:220px}.rules{grid-template-columns:repeat(2,1fr);gap:7px}.rule{padding:10px}.rule b{font-size:16px}.rule span{font-size:8px}.footer{font-size:9px;margin-top:14px}}
@media(max-width:520px){.title{font-size:34px}.top-right{margin-top:12px}.live{font-size:10px}.updated{font-size:10px}.preseason{margin-bottom:12px}.score{gap:8px}.card{min-height:0}.photo-area{height:165px}.photo,.jet .photo{left:0;right:auto;width:48%;height:100%;object-position:center bottom}.team-mark{font-size:54px;top:28px;left:15px}.jet .team-mark{left:15px;right:auto}.player-copy,.jet .player-copy{top:15px;left:47%;right:auto}.name{font-size:20px;margin-top:4px}.team{font-size:8px}.number{font-size:12px;margin-top:5px}.points,.jet .points{left:47%;right:auto;bottom:11px}.points-value{font-size:44px}.points-label{font-size:7px;margin-top:3px}.middle{padding:1px 0 2px}.vs{font-size:8px}.leader{font-size:16px;margin-top:3px}.margin{font-size:8px}.stats{padding:8px 2px 9px}.stat b{font-size:15px}.stat span{font-size:6.5px}.chart svg{height:190px}.legend{gap:10px;font-size:9px}.table th,.table td{padding:6px 4px;font-size:9px}.table th{font-size:7px}.panel-head{gap:4px}.panel-note{width:100%}}
</style>
</head>
<body>
<main id="app">
<section class="top"><div><div class="kicker">2026 NFL Season · Regular Season Only</div><h1 class="title">Harrison Has a Tight End</h1><div class="subtitle">Elijah Arroyo vs. Kenyon Sadiq · One bet. One leaderboard.</div></div><div class="top-right"><div class="live"><span class="pulse"></span><span id="status">Updating live data…</span></div><div class="updated" id="updated">Last updated: —</div></div></section>
<div id="preseason" class="preseason"><div class="preseason-title">🏈 PRESEASON MODE</div><div class="preseason-copy">The 2026 regular season hasn’t started yet. Stats will update after Week 1.</div></div>
<div id="content"><div class="loading">Loading the scoreboard…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(n,d=1){return Number(n||0).toFixed(d)}
const PHOTOS={arroyo:'https://a.espncdn.com/i/headshots/nfl/players/full/4678006.png',sadiq:'https://a.espncdn.com/i/headshots/college-football/players/full/5083315.png'};
function playerCard(p,key){const jet=key==='sadiq';return `<section class="card ${jet?'jet':'sea'}"><div class="photo-area"><div class="team-mark">${jet?'NYJ':'SEA'}</div><img class="photo" src="${PHOTOS[key]}" alt="${esc(p.name)}" onerror="this.style.display='none'"><div class="player-copy"><div class="team">${esc(p.team)} · ${esc(p.position)}</div><div class="name">${esc(p.name)}</div><div class="number">#${esc(p.number)}</div></div><div class="points"><div class="points-value">${fmt(p.fantasyPoints)}</div><div class="points-label">Fantasy points</div></div></div><div class="stats"><div class="stat"><b>${p.receptions}</b><span>Receptions</span></div><div class="stat"><b>${p.receivingYards}</b><span>Yards</span></div><div class="stat"><b>${p.receivingTds}</b><span>TDs</span></div><div class="stat"><b>${p.twoPt}</b><span>2PT</span></div><div class="stat"><b>${p.drops===null?'—':p.drops}</b><span>Drops</span></div></div></section>`}
function makeChart(a,b){const W=900,H=285,L=42,R=20,T=20,B=36;const max=Math.max(5,...a.map(x=>x.points),...b.map(x=>x.points));const x=i=>L+(i/17)*(W-L-R);const y=v=>T+(H-B-T)*(1-v/max);let grid='';for(let i=0;i<5;i++){let v=max*i/4;grid+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-7}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`}const path=d=>d.map((q,i)=>(i?'L':'M')+x(q.week-1)+' '+y(q.points)).join(' ');let dots=d=>d.map(q=>`<circle class="dot-${q.team==='SEA'?'sea':'jet'}" cx="${x(q.week-1)}" cy="${y(q.points)}" r="3"/>`).join('');let labels='';for(let i=0;i<18;i++)labels+=`<text class="axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${i%2===0?'W'+(i+1):''}</text>`;return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative fantasy points by week">${grid}${labels}<path class="line-sea" d="${path(a)}"/><path class="line-jet" d="${path(b)}"/>${dots(a)}${dots(b)}</svg>`}
function table(rows,preseason){return `<div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Arroyo</th><th>Sadiq</th><th>Winner</th><th>Margin</th></tr></thead><tbody>${rows.map(r=>{const played=!preseason&&((r.arroyo!==0)||(r.sadiq!==0));const first=preseason&&r.week===1;const a=first?'0.0':played?fmt(r.arroyo):'—';const b=first?'0.0':played?fmt(r.sadiq):'—';const w=first?'TIED':played?(r.arroyo>r.sadiq?'ARROYO':r.sadiq>r.arroyo?'SADIQ':'TIED'):'—';const m=first?'0.0':played?fmt(Math.abs(r.arroyo-r.sadiq)):'—';return `<tr><td>${r.week}</td><td class="${played&&r.arroyo>r.sadiq?'winner':''}">${a}</td><td class="${played&&r.sadiq>r.arroyo?'winner':''}">${b}</td><td>${w}</td><td>${m}</td></tr>`}).join('')}</tbody></table></div>`}
function formatUpdated(s){const d=new Date(s);return isNaN(d)?'Last updated: —':'Last updated: '+d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'})}
async function load(){try{const res=await fetch('/api/stats',{cache:'no-store'});if(!res.ok)throw new Error('Stats service returned '+res.status);const d=await res.json();if(!d?.players?.arroyo||!d?.players?.sadiq||!Array.isArray(d.weekly)||!d?.charts?.arroyo||!d?.charts?.sadiq)throw new Error('Stats response is missing expected fields');const a=d.players.arroyo,b=d.players.sadiq;const preseason=String(d.source||'').includes('preseason');$('#preseason').style.display=preseason?'block':'none';const leader=a.fantasyPoints===b.fantasyPoints?'TIED':a.fantasyPoints>b.fantasyPoints?'ARROYO LEADS':'SADIQ LEADS';const margin=Math.abs(a.fantasyPoints-b.fantasyPoints);const rows=d.weekly.map(w=>({week:w.week,arroyo:w.arroyo.fantasyPoints,sadiq:w.sadiq.fantasyPoints,arroyoRec:w.arroyo.receptions,sadiqRec:w.sadiq.receptions,arroyoYds:w.arroyo.receivingYards,sadiqYds:w.sadiq.receivingYards}));$('#content').innerHTML=`<div class="score">${playerCard(a,'arroyo')}<div class="middle"><div class="vs">VS</div><div class="leader">${leader}</div><div class="margin">${fmt(margin)} point margin</div></div>${playerCard(b,'sadiq')}</div><div class="lower"><section class="panel"><div class="panel-head"><div class="panel-title">The season race</div><div class="panel-note">Cumulative fantasy points · 2026 regular season</div></div><div class="chart">${makeChart(d.charts.arroyo,d.charts.sadiq)}</div><div class="legend"><div class="key"><span class="swatch sea-dot"></span> Elijah Arroyo</div><div class="key"><span class="swatch jet-dot"></span> Kenyon Sadiq</div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Weekly scoreboard</div><div class="panel-note">Scoring calculated from league rules</div></div>${table(rows,preseason)}</section></div><section class="panel"><div class="panel-head"><div class="panel-title">Scoring rules</div><div class="panel-note">Your league settings</div></div><div class="rules"><div class="rule"><b>+1</b><span>Per reception</span></div><div class="rule"><b>+1</b><span>Per 10 receiving yards</span></div><div class="rule"><b>+6</b><span>Per touchdown</span></div><div class="rule"><b>+2</b><span>Per 2-point conversion</span></div></div></section><div class="footer">Data source: nflverse · Regular season stats only · Drops are tracked separately and do not affect fantasy points.</div>`;$('#status').textContent='Live data · refreshed every 5 min';$('#updated').textContent=formatUpdated(d.updatedAt)}catch(e){console.error('Scoreboard load failed:',e);$('#content').innerHTML=`<div class="error">Couldn't load live stats right now. The site will retry automatically.</div>`;$('#status').textContent='Data connection unavailable'}}load();setInterval(load,300000);
</script>
</body>
</html>
