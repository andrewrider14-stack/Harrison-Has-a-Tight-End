<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Harrison Has a Tight End</title>
<style>
:root{--bg:#070a0f;--panel:#10151d;--panel2:#151c26;--line:#273241;--text:#f4f7fb;--muted:#8d9bad;--sea:#69c6d8;--jet:#f47b20;--good:#70e1a1;--danger:#ff7070}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#182332 0,#070a0f 42%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px;flex-wrap:wrap}.kicker{text-transform:uppercase;letter-spacing:.16em;color:#a8b5c6;font-size:11px;font-weight:800}.title{font-size:clamp(34px,6vw,64px);line-height:.95;letter-spacing:-.055em;font-weight:950;margin:8px 0}.subtitle{color:var(--muted);font-size:15px}.live{border:1px solid var(--line);background:#0d1219;border-radius:999px;padding:9px 13px;font-size:12px;color:#aeb9c7;display:flex;gap:8px;align-items:center}.pulse{width:8px;height:8px;background:var(--good);border-radius:50%}.score{display:grid;grid-template-columns:1fr 90px 1fr;gap:12px;align-items:stretch}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;overflow:hidden}.player-top{padding:20px 20px 14px;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.player-id{display:flex;gap:13px;align-items:center}.jersey{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-weight:950;font-size:25px;background:#102f3a;color:#d9f8ff;border:1px solid #285c69}.jersey.jet{background:#3b2113;color:#ffd4b4;border-color:#74441f}.team{text-transform:uppercase;font-size:10px;letter-spacing:.13em;color:var(--muted);font-weight:800}.name{font-size:22px;font-weight:900;letter-spacing:-.025em;margin-top:3px}.rank{font-size:10px;color:var(--muted);margin-top:4px}.points{padding:0 20px 18px}.points-value{font-size:62px;font-weight:950;line-height:.95;letter-spacing:-.06em}.points-label{text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--muted);font-weight:800;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:15px 14px 16px;gap:8px}.stat{text-align:center}.stat b{font-size:19px;display:block}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.middle{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.vs{font-size:11px;color:var(--muted);letter-spacing:.2em;font-weight:900}.leader{font-size:18px;font-weight:950;margin-top:8px}.margin{font-size:10px;color:var(--muted);margin-top:3px}.panel{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}.panel-title{font-weight:900}.panel-note{font-size:11px;color:var(--muted)}.chart{margin-top:15px}.chart svg{width:100%;height:250px;display:block}.gridline{stroke:#273241;stroke-width:1}.axis{fill:#718095;font-size:10px}.line-sea{fill:none;stroke:var(--sea);stroke-width:3.5}.line-jet{fill:none;stroke:var(--jet);stroke-width:3.5}.dot-sea{fill:var(--sea)}.dot-jet{fill:var(--jet)}.legend{display:flex;gap:18px;margin-top:7px;font-size:11px;color:#aab6c5}.key{display:flex;gap:7px;align-items:center}.swatch{width:10px;height:10px;border-radius:50%}.sea{background:var(--sea)}.jetc{background:var(--jet)}.table-wrap{overflow:auto;margin-top:12px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:right;padding:10px 8px;border-bottom:1px solid #202a36;font-size:12px}.table th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.table th:first-child,.table td:first-child{text-align:left}.table .winner{font-weight:950}.table tr:last-child td{border-bottom:0}.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.rule{background:#0c1118;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.rule b{display:block;font-size:18px}.rule span{font-size:10px;color:var(--muted)}.preseason{margin-top:16px;padding:12px 14px;border:1px solid #2c4650;background:#0d1820;border-radius:12px;color:#a9d8e2;font-size:12px}.footer{color:#667487;font-size:10px;text-align:center;margin-top:18px;line-height:1.5}.error{padding:14px;background:#281518;border:1px solid #5a2b31;border-radius:12px;color:#ffb2b2;font-size:13px}.loading{color:var(--muted);font-size:13px;padding:15px 0}@media(max-width:720px){main{padding:22px 13px 45px}.score{grid-template-columns:1fr}.middle{padding:5px}.player-top{padding:16px}.points{padding:0 16px 15px}.points-value{font-size:52px}.stats{padding-left:8px;padding-right:8px}.rules{grid-template-columns:repeat(2,1fr)}.chart svg{height:210px}}
</style>
</head>
<body>
<main id="app">
<section class="top"><div><div class="kicker">2026 NFL Season · Regular Season Only</div><h1 class="title">Harrison Has a Tight End</h1><div class="subtitle">Elijah Arroyo vs. Kenyon Sadiq · One bet. One leaderboard.</div></div><div class="live"><span class="pulse"></span><span id="status">Updating live data…</span></div></section>
<div id="content"><div class="loading">Loading the scoreboard…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n,d=1){return Number(n||0).toFixed(d)}
function updatedLabel(iso){try{return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(iso))}catch{return iso}}
function playerCard(p,jet=false){return `<section class="card"><div class="player-top"><div class="player-id"><div class="jersey ${jet?'jet':''}">${esc(p.number)}</div><div><div class="team">${esc(p.team)} · ${esc(p.position)}</div><div class="name">${esc(p.name)}</div><div class="rank">${p.games?`${p.games} regular-season game${p.games===1?'':'s'}`:'Regular season begins Week 1'}</div></div></div></div><div class="points"><div class="points-value">${fmt(p.fantasyPoints)}</div><div class="points-label">Fantasy points</div></div><div class="stats"><div class="stat"><b>${p.receptions}</b><span>Receptions</span></div><div class="stat"><b>${p.receivingYards}</b><span>Yards</span></div><div class="stat"><b>${p.receivingTds}</b><span>TDs</span></div><div class="stat"><b>${p.twoPt}</b><span>2PT</span></div><div class="stat"><b>${p.drops===null?'—':p.drops}</b><span>Drops</span></div></div></section>`}
function makeChart(a,b){const W=900,H=250,L=42,R=20,T=20,B=34;const max=Math.max(5,...a.map(x=>x.points),...b.map(x=>x.points));const x=i=>L+(i/17)*(W-L-R);const y=v=>T+(H-B-T)*(1-v/max);let grid='';for(let i=0;i<5;i++){let v=max*i/4;grid+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-7}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`}const path=d=>d.map((q,i)=>(i?'L':'M')+x(q.week-1)+' '+y(q.points)).join(' ');const dots=d=>d.map(q=>`<circle class="dot-${q.team==='SEA'?'sea':'jet'}" cx="${x(q.week-1)}" cy="${y(q.points)}" r="3.2"/>`).join('');let labels='';for(let i=0;i<18;i+=3)labels+=`<text class="axis" x="${x(i)}" y="${H-7}" text-anchor="middle">W${i+1}</text>`;return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative fantasy points by week">${grid}${labels}<path class="line-sea" d="${path(a)}"/><path class="line-jet" d="${path(b)}"/>${dots(a)}${dots(b)}</svg>`}
function table(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Arroyo FP</th><th>Sadiq FP</th><th>Arroyo Rec</th><th>Sadiq Rec</th><th>Arroyo Yds</th><th>Sadiq Yds</th></tr></thead><tbody>${rows.map(r=>`<tr><td>Week ${r.week}</td><td class="${r.arroyo>r.sadiq?'winner':''}">${fmt(r.arroyo)}</td><td class="${r.sadiq>r.arroyo?'winner':''}">${fmt(r.sadiq)}</td><td>${r.arroyoRec}</td><td>${r.sadiqRec}</td><td>${r.arroyoYds}</td><td>${r.sadiqYds}</td></tr>`).join('')}</tbody></table></div>`}
async function load(){try{const res=await fetch('/api/stats',{cache:'no-store'});if(!res.ok)throw new Error('Stats service returned '+res.status);const d=await res.json();if(!d?.players?.arroyo||!d?.players?.sadiq||!Array.isArray(d.weekly)||!d?.charts?.arroyo||!d?.charts?.sadiq)throw new Error('Stats response is missing expected fields');const a=d.players.arroyo,b=d.players.sadiq;const leader=a.fantasyPoints===b.fantasyPoints?'TIED':a.fantasyPoints>b.fantasyPoints?'ARROYO LEADS':'SADIQ LEADS';const margin=Math.abs(a.fantasyPoints-b.fantasyPoints);const rows=d.weekly.map(w=>({week:w.week,arroyo:w.arroyo.fantasyPoints,sadiq:w.sadiq.fantasyPoints,arroyoRec:w.arroyo.receptions,sadiqRec:w.sadiq.receptions,arroyoYds:w.arroyo.receivingYards,sadiqYds:w.sadiq.receivingYards}));const preseason=a.games===0&&b.games===0;$('#content').innerHTML=`<div class="score">${playerCard(a)}<div class="middle"><div class="vs">VS</div><div class="leader">${leader}</div><div class="margin">${fmt(margin)} point margin</div></div>${playerCard(b,true)}</div>${preseason?'<div class="preseason">🏈 <b>Preseason mode:</b> the 2026 regular season has not started yet. Both players are at 0.0 fantasy points; preseason stats are intentionally excluded.</div>':''}<section class="panel"><div class="panel-head"><div class="panel-title">The season race</div><div class="panel-note">Cumulative fantasy points · 2026 regular season</div></div><div class="chart">${makeChart(d.charts.arroyo,d.charts.sadiq)}</div><div class="legend"><div class="key"><span class="swatch sea"></span> Elijah Arroyo · SEA</div><div class="key"><span class="swatch jetc"></span> Kenyon Sadiq · NYJ</div></div></section><section class="panel"><div class="panel-head"><div class="panel-title">Weekly scoreboard</div><div class="panel-note">Scoring is calculated from the rules below</div></div>${table(rows)}</section><section class="panel"><div class="panel-head"><div class="panel-title">Scoring rules</div><div class="panel-note">Your league settings</div></div><div class="rules"><div class="rule"><b>+1</b><span>Per reception</span></div><div class="rule"><b>+1</b><span>Per 10 receiving yards</span></div><div class="rule"><b>+6</b><span>Per touchdown</span></div><div class="rule"><b>+2</b><span>Per 2-point conversion</span></div></div></section><div class="footer">Data source: nflverse · Regular season stats only · Drops are tracked separately and do not affect fantasy points. Last data check: ${esc(updatedLabel(d.updatedAt))}</div>`;$('#status').textContent='Live data · refreshed every 5 min'}catch(e){console.error('Scoreboard load failed:',e);$('#content').innerHTML=`<div class="error">Couldn't load live stats right now. The site will retry automatically.</div>`;$('#status').textContent='Data connection unavailable'}}
load();setInterval(load,300000);
</script>
</body>
</html>
